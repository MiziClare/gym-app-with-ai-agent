server:
  port: ${SERVER_PORT:9090}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
      timeout: 2h

spring:
  application:
    name: gym-platform-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gym_portfolio?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  web:
    resources:
      add-mappings: false
  ai:
    model:
      chat: ${AI_PROVIDER:none}
    openai:
      base-url: ${AI_BASE_URL:https://api.openai.com}
      api-key: ${AI_API_KEY:disabled}
      chat:
        options:
          model: ${AI_MODEL:gpt-4o-mini}
          temperature: 0.2

mybatis:
  configuration:
    map-underscore-to-camel-case: true

app:
  demo-data: ${DEMO_DATA:true}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  membership-pass-secret: ${MEMBERSHIP_PASS_SECRET:}

logging:
  level:
    com.gymplatform: INFO
